};
const codes=order.map(x=>x[0]);
const wanted=q.get('language')==='pt'?'pt-PT':q.get('language');
const device=(navigator.language||'').toLowerCase();
let lang=codes.includes(wanted)?wanted:(codes.find(c=>device===c.toLowerCase())||codes.find(c=>device.split('-')[0]===c.split('-')[0])||'en');
let counts=null;
const overlay=document.querySelector('.lang-overlay'),grid=document.querySelector('.lang-panel .grid');
const buttons=[];
for(const [code,flag,label] of order)for(const box of [overlay,grid]){
 const b=document.createElement('button');b.type='button';b.className='language';b.dataset.lang=code;b.lang=code;
 b.textContent=flag+' '+label;b.setAttribute('aria-pressed','false');
 b.addEventListener('click',()=>choose(code));box.append(b);buttons.push(b);
}
const nameplate=document.getElementById('nameplate');
const hint=document.getElementById('hint'),panelStatus=document.getElementById('panelStatus');
const open=document.getElementById('openGift'),openBig=document.getElementById('openBig');
function say(message){hint.textContent=message;hint.style.display=message?'block':'none';panelStatus.textContent=message;}
function drawNames(){
 nameplate.replaceChildren();
 if(!valid||!names[0]||!names[1]){nameplate.textContent=copy[lang].gift;nameplate.style.display='flex';return;}
 const lead=document.createElement('span'),sender=document.createElement('span'),tail=document.createElement('span');
 sender.className='sender';lead.textContent=names[0]+', ';sender.textContent=names[1];
 tail.textContent=names[2]?' '+copy[lang].from+' '+names[2]+' '+copy[lang].sent:' '+copy[lang].sent;
 const line=document.createElement('p');line.style.margin='0';line.append(lead,sender,tail);nameplate.append(line);nameplate.style.display='flex';
}
function choose(code){
 lang=code;document.documentElement.lang=code;
 for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.lang===code));
 document.getElementById('panelTitle').textContent=copy[code].title;
 openBig.textContent='🎁 '+copy[code].open;open.setAttribute('aria-label',copy[code].open);
 say('');drawNames();
 const shelf=document.getElementById('aom-shelf');if(shelf)shelf.dataset.language=code;
 document.dispatchEvent(new CustomEvent('aom:language',{detail:code}));
}
function download(){
 if(open.disabled)return;
 if(counts&&!counts[lang]){say(copy[lang].soon);return;}
 const dest=valid&&claimLanguages.includes(lang)
  ?backend+'/barber/redeem?'+new URLSearchParams({gift:token,language:lang,download:'1'})
  :backend+'/barber/free-bundle.zip?'+new URLSearchParams({language:lang});
 open.disabled=openBig.disabled=true;
 say(copy[lang].downloading);
 location.assign(dest);
 setTimeout(()=>{open.disabled=openBig.disabled=false;},6000);
}
open.addEventListener('click',download);openBig.addEventListener('click',download);
addEventListener('pageshow',()=>{open.disabled=openBig.disabled=false;});
fetch(backend+'/api/storybook/catalog',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{
 if(!data||!Array.isArray(data.editions))return;
 counts={};for(const code of codes)counts[code]=new Set(data.editions.filter(e=>e.language===code).map(e=>e.slug)).size;
 for(const b of buttons)b.title=counts[b.dataset.lang]?counts[b.dataset.lang]+' 📚':copy[b.dataset.lang].soon;
}).catch(()=>{});
choose(lang);
})();
</script></body></html>
