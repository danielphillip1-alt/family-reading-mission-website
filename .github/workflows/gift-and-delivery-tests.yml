name: Gift and delivery regression checks
on:
  push:
    branches: [production-membership]
    paths:
      - 'member/**'
      - '.github/workflows/gift-and-delivery-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: member/package-lock.json
      - run: npm ci --prefix member
      - run: npm test --prefix member
